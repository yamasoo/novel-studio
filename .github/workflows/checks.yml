name: checks

# 目的：把「靠人記得跑」的檢查變成 push 就擋。
# 這支 workflow 不呼叫任何模型、不花錢，跑完約 1 分鐘（prompt_lang_audit 與 book_eval 用的是假 provider）。
# check_parity 以 --strict 跑：WARN 也擋（2026-10-29 起 WARN 已歸零；那天之前只擋 FAIL）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"     # 每天 02:00（Asia/Taipei）：夜間跑一次回歸測試

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # 1) 既有檢查：提示詞包的鍵／變數、語言檔的變數與空值、路徑不被翻譯
      - name: check_i18n
        run: python tools/check_i18n.py

      # 2) 結構對等檢查：外掛三份的檔案與章節骨架、範本、README、示範書 _範本/、
      #    介面翻譯覆蓋率、術語表禁用譯法、翻譯新鮮度、提示詞句數。
      #    --strict：WARN 也算失敗，所以「待更新翻譯」這種提醒會直接擋下來。
      - name: check_parity
        run: python tools/check_parity.py --strict

      # 3) 提示詞語言稽核：用假 provider 跑一本 3 章的測試書，列出 en／ja 書送出的中文
      - name: prompt_lang_audit
        run: python tools/prompt_lang_audit.py

      # 4) 回歸測試的冒煙版：三本示範書各跑續寫／去 AI 味／審查一次（假 provider）。
      #    只驗流程與提示詞組裝沒有壞；要驗品質請在本機跑真 provider 並用 --baseline 比對。
      - name: book_eval（假 provider）
        run: python tools/book_eval.py
