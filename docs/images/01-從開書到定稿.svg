<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="從開書到寫完一本書的流程">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; fill: #1f2933; }
    .t { font-size: 17px; font-weight: 700; }
    .s { font-size: 13px; fill: #52606d; }
    .l { font-size: 13px; fill: #5b6b7c; }
    .box { fill: #f5f7fa; stroke: #b6c2cf; stroke-width: 1.5; rx: 12; }
    .key { fill: #e8f1fb; stroke: #6f9fd8; }
    .ok  { fill: #eaf5ec; stroke: #6aa87b; }
    .warn{ fill: #fdf3e3; stroke: #d8a24a; }
    .dash{ stroke: #5b6b7c; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    .line{ stroke: #5b6b7c; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <text class="t" x="40" y="40" style="font-size:20px">從開書到寫完一本書</text>
  <text class="s" x="40" y="64">上面一次做好，下面每一章重複一次</text>
  <rect class="box key" x="20" y="88" width="152" height="74"/>
  <text class="t" x="96" y="121.5" text-anchor="middle">選書庫</text>
  <text class="s" x="96" y="141.5" text-anchor="middle">設定頁指定資料夾</text>
  <rect class="box " x="216" y="88" width="152" height="74"/>
  <text class="t" x="292" y="121.5" text-anchor="middle">開書</text>
  <text class="s" x="292" y="141.5" text-anchor="middle">訪談／骨架／匯入</text>
  <rect class="box " x="412" y="88" width="152" height="74"/>
  <text class="t" x="488" y="121.5" text-anchor="middle">設定集</text>
  <text class="s" x="488" y="141.5" text-anchor="middle">角色・勢力・世界觀</text>
  <rect class="box " x="608" y="88" width="152" height="74"/>
  <text class="t" x="684" y="121.5" text-anchor="middle">卷綱</text>
  <text class="s" x="684" y="141.5" text-anchor="middle">這一卷承諾什麼</text>
  <rect class="box " x="804" y="88" width="152" height="74"/>
  <text class="t" x="880" y="121.5" text-anchor="middle">章綱</text>
  <text class="s" x="880" y="141.5" text-anchor="middle">每章要完成什麼</text>
  <rect class="box " x="20" y="232" width="152" height="74"/>
  <text class="t" x="96" y="265.5" text-anchor="middle">寫候選稿</text>
  <text class="s" x="96" y="285.5" text-anchor="middle">AI 寫進 候選/</text>
  <rect class="box " x="216" y="232" width="152" height="74"/>
  <text class="t" x="292" y="265.5" text-anchor="middle">檢查</text>
  <text class="s" x="292" y="285.5" text-anchor="middle">用語・AI 味・簡繁</text>
  <rect class="box " x="412" y="232" width="152" height="74"/>
  <text class="t" x="488" y="265.5" text-anchor="middle">審查與修訂</text>
  <text class="s" x="488" y="285.5" text-anchor="middle">逐段選或改</text>
  <rect class="box ok" x="608" y="232" width="152" height="74"/>
  <text class="t" x="684" y="265.5" text-anchor="middle">定稿</text>
  <text class="s" x="684" y="285.5" text-anchor="middle">搬進 正文/</text>
  <rect class="box " x="804" y="232" width="152" height="74"/>
  <text class="t" x="880" y="265.5" text-anchor="middle">追蹤回寫</text>
  <text class="s" x="880" y="285.5" text-anchor="middle">狀態卡・伏筆・摘要</text>
  <path class="line" d="M176,125 L210,125"/>
  <path class="line" d="M372,125 L406,125"/>
  <path class="line" d="M568,125 L602,125"/>
  <path class="line" d="M764,125 L798,125"/>
  <path class="line" d="M176,269 L210,269"/>
  <path class="line" d="M372,269 L406,269"/>
  <path class="line" d="M568,269 L602,269"/>
  <path class="line" d="M764,269 L798,269"/>
  <path class="line" d="M880,166 L880,226"/>
  <text class="l" x="870" y="200" text-anchor="end">排好章綱才寫章</text>
  <path class="dash" d="M880,312 L880,372 L96,372 L96,316"/>
  <text class="l" x="346" y="364" text-anchor="middle">下一章：回到「寫候選稿」；章綱與追蹤會累積成續寫合約</text>
</svg>
